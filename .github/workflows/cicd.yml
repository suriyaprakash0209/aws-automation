name: CI/CD Pipeline — Flask App (Prod Ready)

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: flask-cicd-app
  CONTAINER_NAME: flask-cicd-app

jobs:

  # ─────────────────────────────
  # 1. TEST
  # ─────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Node 24 (future-proof)
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest tests/ -v
        
      - name: Debug Project Structure
        run: ls -R
          pwd
          ls -la
          ls -R

  # ─────────────────────────────
  # 2. BUILD & PUSH IMAGE
  # ─────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image (single build, multi-tag)
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ─────────────────────────────
  # 3. DEPLOY
  # ─────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "🚀 Starting Deployment..."

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:latest

            # Stop & remove old container
            docker stop flask-cicd-app || true
            docker rm flask-cicd-app || true

            # Run new container
            docker run -d \
              --name flask-cicd-app \
              --restart unless-stopped \
              -p 80:5000 \
              ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:latest

            # Health check
            sleep 5
            curl -f http://localhost/health

            echo "✅ Deployment successful"

            # Cleanup
            docker image prune -f
