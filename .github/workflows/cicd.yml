test:
  name: Run Tests
  runs-on: ubuntu-latest

  steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 🔍 MUST COME FIRST
    - name: Debug Project Structure
      run: |
        echo "Current directory:"
        pwd
        echo "Files in root:"
        ls -la
        echo "Full tree:"
        ls -R

    # ✅ Smart install (handles all cases)
    - name: Install Dependencies
      run: |
        if [ -f requirements.txt ]; then
          echo "✅ Found root requirements.txt"
          pip install -r requirements.txt
        elif [ -f app/requirements.txt ]; then
          echo "⚠️ Found app/requirements.txt"
          pip install -r app/requirements.txt
        else
          echo "❌ requirements.txt not found anywhere"
          exit 1
        fi

    # ✅ Handle test folder mismatch
    - name: Run Tests
      run: |
        if [ -d tests ]; then
          pytest tests/ -v
        elif [ -d test ]; then
          pytest test/ -v
        else
          echo "❌ No test folder found"
          exit 1
        fi
