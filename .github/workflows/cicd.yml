name: CI/CD Pipeline — Flask App (Prod Ready)

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: flask-cicd-app
  CONTAINER_NAME: flask-cicd-app

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug Project Structure
        run: |
          pwd
          ls -la
          ls -R

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          else
            echo "❌ requirements.txt not found"
            exit 1
          fi

      - name: Run Tests
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          elif [ -d test ]; then
            pytest test/ -v
          else
            echo "❌ No test folder found"
            exit 1
          fi

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:${{ github.sha }} \
            .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker pull ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:latest
            docker stop flask-cicd-app || true
            docker rm flask-cicd-app || true
            docker run -d \
              --name flask-cicd-app \
              -p 80:5000 \
              ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:latest
            sleep 5
            curl -f http://localhost/health
